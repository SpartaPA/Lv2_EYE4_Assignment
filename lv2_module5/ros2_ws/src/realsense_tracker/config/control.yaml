# control_node ROS 파라미터 — 실제 추적(Production) Source of Truth (제어 담당 관리)
# 사용: tracker.launch.py start_control:=true (기본 control_params). 모의 시험용 값은 control_dry.yaml.
#
# 제어식 (control_core.py):
#   pan  = clamp(pan_direction  * kp_pan  * ex, ±pan_speed_limit_rad_s)    |ex| <= pan_deadband  이면 0
#   tilt = clamp(tilt_direction * kp_tilt * ey, ±tilt_speed_limit_rad_s)   |ey| <= tilt_deadband 이면 0
#   ex, ey는 무차원(-1~1) → Kp 단위 = rad/s, 명령 단위 = rad/s (모터 원시 부호)
#
# 주의 — 아래 Kp는 기존 팀 초기값(모의 시험값과 동일)이며 튜닝·A/B 비교로 확정한 값이 아니다.
#   Kp A/B 세트는 lv2_module5/config/test.yaml에 시험 전에 기록하고, 시험 시 -p kp_pan:=... 로 바꿔 실행한다.
control_node:
  ros__parameters:
    kp_pan: 0.1                 # rad/s per 1.0 ex; 작업 설정 선정 근거: docs/control_progress_20261008.md
    kp_tilt: 0.1                # rad/s per 1.0 ey; 이번 Pan Kp 비교에서 유지
    # 속도 상한: 펌웨어 MAX_RAD_S(0.05 rad/s) 이하만 허용 (초과 시 노드 시작 거부)
    pan_speed_limit_rad_s: 0.05
    tilt_speed_limit_rad_s: 0.05
    pan_deadband: 0.03          # |ex| 이하이면 Pan 0 (중심 떨림 방지)
    tilt_deadband: 0.03         # |ey| 이하이면 Tilt 0
    target_timeout_sec: 0.5     # 발제문 기본값. 바꾸면 이유를 report에 기록
    recovery_frames: 3          # LOST → TRACKING 복귀에 필요한 연속 신선 검출 프레임 수
    # 영상 오차 부호 → 모터 원시 속도 부호. 여기서 한 번만 적용 (bridge·펌웨어는 다시 곱하지 않음)
    # 근거: docs/hardware.md 실구동 방향 — Pan 양의 명령 = 좌측, Tilt 양의 명령 = 아래쪽
    #   목표가 오른쪽(ex>0) → 카메라를 오른쪽으로 → Pan 음의 명령 → pan_direction = -1
    #   목표가 아래쪽(ey>0) → 카메라를 아래로     → Tilt 양의 명령 → tilt_direction = +1
    # 실제 영상 오차 감소 방향(카메라 장착 상태에서의 폐루프 부호)은 README 12단계로 다시 확인한다.
    pan_direction: -1
    tilt_direction: 1
