# realsense_tracker ROS 2 노드 파라미터 (통합 담당 관리, 값은 각 담당이 제안)
# 초안: perception_node 항목만 인지 담당(김상화)이 작성 — 다른 노드 항목은 각 담당이 추가

perception_node:
  ros__parameters:
    # 카메라 토픽 이름은 lv2_module5/config/camera.yaml에서 읽음 → 그 파일 경로 (launch에서 절대 경로로 지정)
    # 직접 실행할 때: -p camera_config:=$PWD/config/camera.yaml (lv2_module5 폴더에서)
    camera_config: ""

    # 목표 색 범위 — lv2_module5/tools/hsv_tuning.py에서 's'로 저장하면 아래 세 값이 바뀜 (주석은 유지)
    hsv_lower: [93, 120, 35]      # [H, S, V] 하한 (OpenCV: H 0~179, S/V 0~255)
    hsv_upper: [130, 255, 255]    # [H, S, V] 상한
    min_area_ratio: 0.002         # 화면 넓이 대비 최소 크기 (640x480에서 약 614px)
    blur_ksize: 5                 # 가우시안 블러 크기 (홀수, 1이면 블러 안 함)
    morph_ksize: 5                # 잡음 제거(열기/닫기) 크기 (1이면 안 함)

    # 깊이 — 유효 추적 거리 판정에 사용 (거리 값은 /target에 넣지 않고 확인 화면·로그에만 표시)
    use_depth: true               # true면 camera.yaml의 aligned_depth_topic(컬러에 정렬된 깊이)도 구독 (거리 판정에 필요)
    depth_unit_m: 0.001           # 16UC1 깊이 값 1이 몇 m인지 (RealSense 기본 1mm)
    depth_min_valid_ratio: 0.5    # 목표 영역에서 깊이가 측정된 비율이 이보다 낮으면 거리를 비움
    depth_max_spread_cm: 5.0      # 목표 영역 깊이 값의 흩어짐(p25~p75)이 이보다 크면 거리를 비움
    # 유효 추적 거리 (팀 결정) — 목표까지 거리가 이 범위 밖이거나 거리를 잴 수 없으면 미검출과 같이 x=y=z=0 발행
    # 이 두 값은 코드에 기본값이 없음 → 여기서만 관리 (빠지면 노드가 시작하지 않음)
    depth_min_distance_cm: 13.0   # 최소 거리 (cm)
    depth_max_distance_cm: 100.0  # 최대 거리 (cm)

    publish_debug_image: false    # true면 /perception/debug_image 발행 (검출 결과를 그린 확인용 영상, 평가 도구에 필요)
    stats_period_sec: 1.0         # 이 간격(초)마다 처리 FPS·처리 시간을 로그로 남김 (0이면 끔, /target 발행 주기와 무관)

    # QoS (모두 depth 1)
    target_reliable: false        # /target 발행: false = best effort (발제문 규약) → 구독 측(제어)도 best effort로 받아야 연결됨
    image_reliable: true          # 영상 구독: true = reliable
                                  # 실측(2026-10-06, wrapper 640x480 30fps): best effort 구독 → 컬러 1.2 fps·정렬 깊이 0 fps,
                                  # reliable 구독 → 둘 다 29.4 fps (wrapper 발행 QoS: RELIABLE, KEEP_LAST 1)
