# Host configuration contract; firmware does not load YAML.
port: "/dev/serial/by-id/usb-ROBOTIS_OpenCR_Virtual_ComPort_in_FS_Mode_FFFFFFFEFFFF-if00"
usb_serial_baudrate: 115200
# A generic baudrate must never ambiguously refer to both links.
dynamixel_baudrate: 1000000
dynamixel_protocol_version: 2.0
pan_motor_id: 11
tilt_motor_id: 12
command_timeout_sec: 0.3
bus_watchdog_sec: 0.2
# Apply these ONCE in control_node to image errors, not again in bridge/firmware.
pan_direction: -1
tilt_direction: 1
velocity_convention: motor_native_rad_s
max_velocity_rad_s: 0.05
# Host dry_run means do not open serial; distinct from board MODE=DRY parser testing.
dry_run: true
# Proposed bench limits; not full mechanical travel approval.
pan_neutral_encoder: 3078
tilt_neutral_encoder_modulo: 0
startup_tolerance_counts: 20
stop_boundary_counts: 80
outer_fault_counts: 100
